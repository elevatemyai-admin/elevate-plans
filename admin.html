<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/><title>Plans admin | elevatemy.ai</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1B3A6B;--teal:#00A99D;--tp:#E1F5F4;--cream:#EDE7DC;--line:#ddd9d0;--muted:#5a5a5a;--sand:#8B7355;--amber:#C4773B}
body{font-family:Inter,Arial,sans-serif;background:#f6f3ec;color:#1a1a1a;font-size:15px;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding:20px}
h1{font-size:1.5rem;color:var(--navy)}h2{font-size:1.1rem;color:var(--navy);margin:18px 0 8px}
button{font:inherit;cursor:pointer}
.b{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:600}
.b.g{background:#fff;color:var(--navy);border:1.5px solid var(--line)}.b.r{background:#fff;color:#a33;border:1.5px solid #e3b5b5}
.b.s{padding:4px 9px;font-size:13px}
input,textarea,select{font:inherit;border:1.5px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;background:#fff}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sand);margin:10px 0 3px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:140px}.row .fix{flex:none;min-width:0;width:auto}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-top:1px solid var(--cream);text-align:left;vertical-align:top;font-size:14px}th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sand);border:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tabs button{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;color:var(--navy)}.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.muted{color:var(--muted);font-size:13px}.pill{display:inline-block;background:var(--tp);color:#0F6E56;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600}
.task{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#fcfbf8}.th{display:flex;gap:8px;align-items:center;padding:8px 10px;cursor:pointer}.th b{flex:1;color:var(--navy)}.tb{padding:4px 12px 12px;display:none}.task.open .tb{display:block}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1}
.ok{color:#0F6E56}.bad{color:#a33}
</style></head><body><div class="wrap" id="app"></div><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const hsh=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)};
const stText=s=>typeof s==='string'?s:s.t;
const stKey=(t,s)=>t.id+':'+hsh(String(stText(s)).replace(/<[^>]+>/g,''));
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEMO={"client": "<mark>[First name]</mark>", "keyDate": "<mark>[date or event]</mark>", "help": {"email": "admin@elevatemy.ai", "text": "[number from the call]", "book": "[booking link]", "reply": "<mark>[X]</mark>"}, "demo": true, "projects": [{"id": "p1", "name": "Get the basics in place", "outcome": "Everything you need is in one place, so the rest goes faster.", "done": "Your logo, photos, story and logins are together, and you have one business email.", "groups": [{"name": "Gather", "sub": "Collect what you already have.", "ids": ["1", "2", "3"]}, {"name": "Set up", "sub": "Small things that save trouble later.", "ids": ["4"]}], "keep": ["Brand basics checklist <mark>[link]</mark>", "Where your files live <mark>[link to the folder we set up]</mark>"]}, {"id": "p2", "name": "Your online home", "outcome": "People can find you online and see what you offer.", "done": "Your <mark>[website or shop]</mark> is live and you have tested it as a customer would.", "groups": [{"name": "Choose", "sub": "One decision, and we help you make it.", "ids": ["5"]}, {"name": "Fill it in", "sub": "Start small. A few items is plenty.", "ids": ["6", "7"]}, {"name": "Go live", "sub": "Payments, then one test.", "ids": ["8", "9"]}], "keep": ["Setup guide for <mark>[platform]</mark>", "Photo tips <mark>[link]</mark>"]}, {"id": "p3", "name": "Get the word out", "outcome": "The right people know who you are and what you offer.", "done": "You have an About page, a simple weekly rhythm for posting, and a list of people who want to hear from you.", "groups": [{"name": "Say who you are", "sub": "In your words.", "ids": ["10", "11"]}, {"name": "Show up", "sub": "Small and steady beats big and rare.", "ids": ["12", "13"]}], "keep": ["Post ideas <mark>[link]</mark>", "Our voice prompt <mark>[link]</mark>"]}, {"id": "p4", "name": "<mark>[Big moment: launch, opening or event]</mark>", "outcome": "The right people are told, and the day goes well.", "done": "<mark>[One sentence from the call on what success looks like]</mark>", "groups": [{"name": "Spread the word", "sub": "Start about <mark>[X]</mark> weeks before.", "ids": ["14", "15", "16"]}, {"name": "Get ready", "sub": "The last stretch.", "ids": ["17"]}], "keep": ["Checklist for the day <mark>[link]</mark>"]}], "tasks": [{"id": "1", "title": "Gather your logo and best photos into one folder", "why": "So you never hunt for them again.", "mins": 20, "ai": false, "steps": ["Open <mark>[where: e.g. the shared Google Drive folder we set up for you]</mark>.", "Add your logo and your 20 best photos.", "Name the folder \"Brand basics\"."]}, {"id": "2", "title": "Write your story in a few sentences", "why": "You will use this everywhere.", "mins": 15, "ai": true, "steps": ["Jot down why you started and what you want people to know.", "Paste your notes into the prompt below, in your AI helper (<mark>[tool we set up]</mark>), or just write it yourself.", "Read it out loud and fix anything that does not sound like you."], "prompt": "I run <mark>[what your business does]</mark>. Here is my story in my own words:\n\n[paste your notes]\n\nTurn this into five short sentences that sound like me, warm and plain, no hype. Ask me a question if anything is missing."}, {"id": "3", "title": "List the accounts you already have", "why": "Website, email, social, payments. Knowing what exists comes first.", "mins": 10, "ai": false, "steps": ["Write down each account and the email it uses.", "Save the list in <mark>[where: e.g. the shared note we set up]</mark>."]}, {"id": "4", "title": "Set up one email address for the business", "why": "Keeps business messages out of your personal inbox.", "mins": 10, "ai": false, "steps": ["Go to <mark>[email tool from the call]</mark>.", "Create an address with your business name.", "Use it for every account from here on."]}, {"id": "5", "title": "Choose where your online home will live", "why": "We narrowed it to two options on the call.", "mins": 15, "ai": false, "steps": ["Look at the two options: <mark>[options]</mark>.", "Pick the one that feels easiest.", "Tell us. We send setup steps for that one."]}, {"id": "6", "title": "Add your first items or pages", "why": "Start with a handful, not everything.", "mins": 45, "ai": false, "steps": ["Follow the guide for <mark>[platform]</mark>.", "Add <mark>[number]</mark> items, each with a photo."]}, {"id": "7", "title": "Write a short description for each item", "why": "Short and honest wins.", "mins": 30, "ai": true, "steps": ["For each one, jot the key details and one thing you like about it.", "Paste your notes into the prompt below.", "Edit each draft so it sounds like you."], "prompt": "Write a short description for my <mark>[website or shop]</mark>. Two or three sentences, warm and plain.\n\nName: [name]\nDetails: [details]\nWhat I like about it: [one thing]\n\nAvoid hype words like \"stunning\" or \"perfect\"."}, {"id": "8", "title": "Set up payments", "why": "So the first sale does not stall.", "mins": 30, "ai": false, "steps": ["Follow the payments guide for <mark>[platform]</mark>.", "Choose the simplest option to start. You can change it later."]}, {"id": "9", "title": "Try it as a customer", "why": "The best way to catch problems early.", "mins": 15, "ai": false, "steps": ["Use a different device if you can.", "Go from the front page to the end, like a customer would.", "Tell us anything that felt confusing."]}, {"id": "10", "title": "Write your About page", "why": "People like knowing who is behind a business.", "mins": 30, "ai": true, "steps": ["Start from your story sentences.", "Add one memory that shows why you do this.", "Use the prompt for a first draft if you like."], "prompt": "Using my story below, write a short About page. First person, friendly, about 150 words.\n\n[paste your five sentences]"}, {"id": "11", "title": "Choose the one or two places you will post", "why": "You do not need to be everywhere.", "mins": 10, "ai": false, "steps": ["Think about where your customers already spend time.", "Pick one or two. Ignore the rest for now."]}, {"id": "12", "title": "Plan your first two weeks of posts", "why": "A list removes the daily \"what do I post?\"", "mins": 30, "ai": true, "steps": ["Copy the prompt into your AI helper.", "Keep the ideas you like and delete the rest.", "Put them on your calendar."], "prompt": "I run <mark>[what your business does]</mark>. Give me 10 simple post ideas I can do with just my phone. Mix behind the scenes, helpful tips, and the story of why I do this."}, {"id": "13", "title": "Start an email sign-up list", "why": "People who ask to hear from you are your best audience.", "mins": 20, "ai": false, "steps": ["We set up the sign-up form. You will find the link in <mark>[where]</mark>.", "Add the link to your <mark>[website or shop]</mark> and your posts.", "Ask five friends to sign up first."]}, {"id": "14", "title": "Pick your date and your goal", "why": "Everything else works backward from this.", "mins": 10, "ai": false, "steps": ["Choose the date: <mark>[from the call]</mark>.", "Write one sentence on what a good result looks like."]}, {"id": "15", "title": "Write your announcement", "why": "One message you can reuse everywhere.", "mins": 20, "ai": true, "steps": ["Fill in the date and details.", "Use the prompt for a first draft, then edit it."], "prompt": "Write a friendly announcement for <mark>[big moment]</mark> on [date] at [place]. Short and warm. Include where to find us online."}, {"id": "16", "title": "List who you want to tell", "why": "Start with people who would be glad to hear it.", "mins": 20, "ai": false, "steps": ["Write down people, groups and local places that fit.", "Add anyone who could share the news for you."]}, {"id": "17", "title": "Plan the day", "why": "A simple plan beats a perfect one.", "mins": 30, "ai": false, "steps": ["Pick a time and who to invite.", "Choose one small thing to make it feel special.", "Put a countdown on your calendar."]}], "overview": {"where": ["<mark>[From the call]</mark>", "<mark>[From the call]</mark>"], "heading": ["<mark>[Goal one]</mark>", "<mark>[Goal two]</mark>"], "tools": [{"area": "Website", "today": "<mark>[today]</mark>", "suggest": "<mark>[suggestion or \"No change needed\"]</mark>"}, {"area": "Email", "today": "<mark>[today]</mark>", "suggest": "<mark>[suggestion]</mark>"}], "results": [{"measure": "<mark>[Measure]</mark>", "start": "<mark>[number]</mark>", "now": "<mark>[number]</mark>", "goal": "<mark>[goal]</mark>"}]}}; let KEY=localStorage.getItem('plansAdminKey')||'',PLANS=[],CUR=null,TAB='basics';
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2000)}
async function api(a){const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':KEY},body:JSON.stringify(a)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Error '+r.status));return j}
function login(){$('app').innerHTML=`<h1>Plans admin</h1><div class="card" style="max-width:380px"><label>Admin key</label><input id="k" type="password" onkeydown="if(event.key==='Enter')doLogin()"/><p id="e" class="bad muted"></p><button class="b" style="margin-top:10px" onclick="doLogin()">Enter</button></div>`}
async function doLogin(){KEY=$('k').value.trim();try{await api({action:'list'});localStorage.setItem('plansAdminKey',KEY);home()}catch(e){$('e').textContent=e.message}}
async function home(){
  CUR=null;
  try{PLANS=(await api({action:'list'})).plans}catch(e){login();return}
  const ago=t=>{if(!t)return 'not opened yet';const d=Math.floor((Date.now()-t)/864e5);return d<1?'today':d+' day'+(d>1?'s':'')+' ago'};
  const imp=pendingImport();
  $('app').innerHTML=(imp?`<div class="card" style="border-color:var(--teal);background:var(--tp)"><b>Ready to import ${imp.length} plans from the old pages:</b> ${imp.map(x=>esc(x.plan.client)+' ('+x.plan.tasks.length+' steps)').join(', ')}. <button class="b s" onclick="doImport()">Import them now</button></div>`:'')+`<div class="row"><h1 class="fix">Client plans</h1><span></span><button class="b fix" onclick="newPlan()">+ New plan</button><button class="b g fix" onclick="addDemo()">Add demo plan</button><a class="b g fix" href="/feedback/responses" target="_blank" style="text-decoration:none">Client feedback</a><button class="b g fix" onclick="backup()">Download backup</button><button class="b g fix" onclick="restore()">Restore backup</button><button class="b g fix" onclick="signOut()">Sign out</button></div>
  <div class="card"><table><tr><th>Client</th><th>Address</th><th>Steps done</th><th>They added</th><th>Last activity</th><th></th></tr>
  ${PLANS.map(p=>`<tr><td><b>${esc(String(p.client).replace(/<[^>]+>/g,""))}</b> ${p.demo?'<span class="pill">demo</span>':''}<div class="muted">${esc(p.id)}</div></td><td class="muted">${p.hosts.map(h=>esc(h)).join('<br>')||'no address yet'}</td><td>${p.done} of ${p.total}</td><td>${p.added}</td><td>${p.demo?'':ago(p.last)}</td><td><button class="b s" onclick="openPlan('${p.id}')">Open</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No plans yet.</td></tr>'}</table></div>
  <p class="muted">Changes you make here show on the client's page within about 30 seconds. Nothing needs uploading or deploying.</p>`;
}
async function addDemo(){if(!confirm('Add (or reset) the demo plan? It will be served at action-plan-elevate-demo.vercel.app.'))return;await api({action:'save',id:'demo',plan:JSON.parse(JSON.stringify(DEMO)),hosts:['action-plan-elevate-demo.vercel.app']});toast('Demo added');home()}
function pendingImport(){try{return window.name.startsWith('ELEVATE_IMPORT:')?JSON.parse(window.name.slice(15)):null}catch(e){return null}}
function convertImport(p){const keys=new Set(p.progress.steps||[]);const dn=new Set(p.progress.done||[]);p.plan.tasks.forEach(t=>{(t.steps||[]).forEach(s=>{if(typeof s!=='string'&&s.d||dn.has(t.id))keys.add(stKey(t,s))});t.steps=(t.steps||[]).map(stText)});p.progress.steps=[...keys]}
async function doImport(){const list=pendingImport();for(const p of list){convertImport(p);await api({action:'save',id:p.id,plan:p.plan,hosts:p.hosts});await api({action:'saveProgress',id:p.id,progress:p.progress})}window.name='';toast('Imported '+list.length+' plans');home()}
function signOut(){localStorage.removeItem('plansAdminKey');KEY='';login()}
function blank(){return {view:'v4',level:'Essentials',advisor:'Tracy',keyISO:'',decided:[],open:[],bank:[],client:'',keyDate:'',help:{email:'admin@elevatemy.ai',text:'',book:'',reply:'2'},demo:false,projects:[{id:'p1',name:'First project',outcome:'',done:'',groups:[{name:'Steps',sub:'',ids:[]}],keep:[]}],tasks:[],overview:{where:[],heading:[],tools:[],results:[]}}}
function newPlan(){const id=(prompt('Short name for the plan (lowercase letters, no spaces), for example rachel')||'').trim().toLowerCase();if(!id)return;if(!/^[a-z0-9-]{1,40}$/.test(id)){toast('Lowercase letters, numbers and dashes only');return}CUR={id,plan:blank(),progress:{done:[],added:[]},hosts:[],isNew:true};TAB='basics';edit()}
async function openPlan(id){const r=await api({action:'get',id});CUR=r;if(!CUR.plan)CUR.plan=blank();TAB='basics';edit()}
async function backup(){const j=await api({action:'export'});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(j,null,1)],{type:'application/json'}));a.download='elevate-plans-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function restore(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{const t=await i.files[0].text();if(!confirm('Restore from this backup? Plans in the file replace plans with the same name.'))return;const r=await api({action:'import',data:JSON.parse(t)});toast('Restored '+r.restored);home()};i.click()}
function tabs(){return `<div class="tabs">${[['basics','Basics'],['steps','Projects and steps'],['overview','Overview'],['bank','Bank'],['progress','Progress'],['json','Raw']].map(t=>`<button class="${TAB===t[0]?'on':''}" onclick="try{collect()}catch(e){};TAB='${t[0]}';edit()">${t[1]}</button>`).join('')}</div>`}
function edit(){
  const p=CUR.plan;
  let body='';
  if(TAB==='basics')body=`<div class="card"><div class="row"><div><label>Client first name</label><input id="b_client" value="${esc(p.client)}"/></div><div><label>Key date or event (optional)</label><input id="b_key" value="${esc(p.keyDate)}"/></div></div>
  <div class="row"><div><label>Email for questions</label><input id="b_email" value="${esc(p.help.email)}"/></div><div><label>Text number (optional)</label><input id="b_text" value="${esc(p.help.text)}"/></div><div><label>Booking link (optional)</label><input id="b_book" value="${esc(p.help.book)}"/></div><div style="max-width:140px"><label>Reply in (days)</label><input id="b_reply" value="${esc(p.help.reply)}"/></div></div>
  <div class="row"><div><label>Page design</label><select id="b_view"><option value="v4" ${p.view==='v4'?'selected':''}>Hub, Tracker and Bank (new)</option><option value="" ${p.view==='v4'?'':'selected'}>Classic (projects list)</option></select></div><div><label>Plan level</label><select id="b_level">${['','Essentials','Growth','Scale'].map(x=>`<option ${p.level===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Your first name (for the client)</label><input id="b_adv" value="${esc(p.advisor||'Tracy')}"/></div><div><label>Key date as a date (for the countdown)</label><input id="b_iso" type="date" value="${esc(p.keyISO||'')}"/></div></div>
  <label>Web addresses for this plan (one per line, no https://)</label><textarea id="b_hosts" placeholder="devon-root-to-rise.vercel.app">${esc((CUR.hosts||[]).join('\n'))}</textarea>
  ${p.demo?'<label><input type="checkbox" id="b_demo" style="width:auto" checked/> This is a demo plan (shows the yellow sample bar and does not save anything)</label>':''}</div>`;
  if(TAB==='steps')body=stepsHtml();
  if(TAB==='overview'){const o=p.overview=p.overview||{};body=`<div class="card"><label>Where they are today (one per line)</label><textarea id="o_where">${esc((o.where||[]).join('\n'))}</textarea><label>Decided so far (one per line)</label><textarea id="o_dec">${esc((p.decided||[]).join('\n'))}</textarea><label>Still open: questions waiting on an answer (one per line)</label><textarea id="o_open">${esc((p.open||[]).join('\n'))}</textarea><label>Where we are heading (one per line)</label><textarea id="o_head">${esc((o.heading||[]).join('\n'))}</textarea>
  <label>Tools: area | what they use today | what we suggest (one per line)</label><textarea id="o_tools">${esc((o.tools||[]).map(r=>[r.area,r.today,r.suggest].join(' | ')).join('\n'))}</textarea>
  <label>Results: measure | started | now | goal (one per line)</label><textarea id="o_res">${esc((o.results||[]).map(r=>[r.measure,r.start,r.now,r.goal].join(' | ')).join('\n'))}</textarea></div>`}
  if(TAB==='bank')body=bankHtml();
  if(TAB==='progress')body=progressHtml();
  if(TAB==='json')body=`<div class="card"><p class="muted">The whole plan as data. Edit with care.</p><textarea id="j" style="min-height:420px;font-family:monospace;font-size:12px">${esc(JSON.stringify(p,null,1))}</textarea></div>`;
  const link=(CUR.hosts||[])[0];
  $('app').innerHTML=`<div class="row"><button class="b g fix" onclick="home()">&larr; All plans</button><h1 class="fix">${esc(p.client||CUR.id)}</h1><span></span>${link?`<a class="b g fix" style="text-decoration:none" target="_blank" href="https://${esc(link)}">View live</a>`:`<a class="b g fix" style="text-decoration:none" target="_blank" href="/?id=${esc(CUR.id)}&k=${encodeURIComponent(KEY)}">Preview</a>`}${TAB!=='progress'?'<button class="b fix" onclick="savePlan()">Save</button>':''}</div>${tabs()}${body}`;
}
function collect(){
  const p=CUR.plan;
  if(TAB==='basics'){p.client=$('b_client').value.trim();p.keyDate=$('b_key').value.trim();p.view=$('b_view').value;p.level=$('b_level').value;p.advisor=$('b_adv').value.trim()||'Tracy';p.keyISO=$('b_iso').value;p.help={email:$('b_email').value.trim(),text:$('b_text').value.trim(),book:$('b_book').value.trim(),reply:$('b_reply').value.trim()};CUR.hosts=$('b_hosts').value.split('\n').map(x=>x.trim()).filter(Boolean);if($('b_demo'))p.demo=$('b_demo').checked}
  if(TAB==='overview'){const L=id=>$(id).value.split('\n').map(x=>x.trim()).filter(Boolean);const cols=(id,k)=>L(id).map(l=>{const c=l.split('|').map(x=>x.trim());const o={};k.forEach((n,i)=>o[n]=c[i]||'');return o});p.overview={where:L('o_where'),heading:L('o_head'),tools:cols('o_tools',['area','today','suggest']),results:cols('o_res',['measure','start','now','goal'])};p.decided=L('o_dec');p.open=L('o_open')}
  if(TAB==='steps')collectSteps();
  if(TAB==='bank')collectBank();
  if(TAB==='json')CUR.plan=JSON.parse($('j').value);
}
async function savePlan(){
  try{collect();const r=await api({action:'save',id:CUR.id,plan:CUR.plan,hosts:CUR.hosts||[]});toast('Saved. Live in about 30 seconds.')}catch(e){toast('Not saved: '+e.message)}
}
/* ----- projects and steps editor ----- */
function tById(id){return CUR.plan.tasks.find(t=>String(t.id)===String(id))}
function stepsHtml(){
  const p=CUR.plan;
  return `<p class="muted">Click a step to open it. Editing a step's wording clears its tick for the client.</p>`+p.projects.map((pr,pi)=>`<div class="card" data-p="${pi}">
  <div class="row"><div><label>Project name</label><input class="pn" value="${esc(pr.name)}"/></div><div><label>What it gets them</label><input class="po" value="${esc(pr.outcome)}"/></div></div>
  <label>This project is done when</label><input class="pd" value="${esc(pr.done)}"/>
  <label>Keep handy (one per line)</label><textarea class="pk" style="min-height:48px">${esc((pr.keep||[]).join('\n'))}</textarea>
  ${pr.groups.map((g,gi)=>`<div style="margin-top:10px;padding-left:10px;border-left:3px solid var(--tp)" data-g="${gi}"><div class="row"><div><label>Group</label><input class="gn" value="${esc(g.name)}"/></div><div><label>Group note</label><input class="gs" value="${esc(g.sub)}"/></div></div>
  ${g.ids.map(id=>{const t=tById(id);if(!t)return '';const sd=(t.steps||[]).map(stText).join('\n');return `<div class="task" data-t="${esc(t.id)}"><div class="th" onclick="this.parentNode.classList.toggle('open')"><b>${esc(String(t.title).replace(/<[^>]+>/g,''))}</b><span class="muted">${t.mins} min</span>
  <button class="b g s" title="Move up" onclick="event.stopPropagation();mv(${pi},${gi},'${esc(t.id)}',-1)">&uarr;</button><button class="b g s" onclick="event.stopPropagation();mv(${pi},${gi},'${esc(t.id)}',1)">&darr;</button><button class="b r s" onclick="event.stopPropagation();delTask(${pi},${gi},'${esc(t.id)}')">Delete</button></div>
  <div class="tb"><label>Step title</label><input class="tt" value="${esc(t.title)}"/><div class="row"><div class="fix" style="width:160px"><label>Due date</label><input class="td" type="date" value="${esc(t.d||'')}"/></div><div><label>Who does it</label><input class="tx" placeholder="Rachel, Tracy, Together" value="${esc(t.who||'')}"/></div><div class="fix"><label>Type</label><select class="ty">${['','Task','Post','Email','Decision','Session'].map(x=>`<option ${((t.type||'')===x)?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Waiting on</label><input class="tz" value="${esc(t.wait||'')}"/></div></div><div class="row"><div><label>Why it matters</label><input class="tw" value="${esc(t.why)}"/></div><div class="fix" style="width:90px"><label>Minutes</label><input class="tm" value="${esc(t.mins)}"/></div><div class="fix"><label>Uses AI</label><select class="ta"><option value="0" ${t.ai?'':'selected'}>No</option><option value="1" ${t.ai?'selected':''}>Yes</option></select></div></div>
  <label>Notes (optional)</label><textarea class="tn">${esc(t.note||'')}</textarea><label>Steps (one per line)</label><textarea class="ts" style="min-height:90px">${esc(sd)}</textarea><label>AI prompt to copy (optional)</label><textarea class="tp">${esc(t.prompt||'')}</textarea></div></div>`}).join('')}
  <button class="b g s" onclick="addTask(${pi},${gi})">+ Add a step</button></div>`).join('')}
  <div style="margin-top:10px"><button class="b g s" onclick="addGroup(${pi})">+ Add a group</button> <button class="b r s" onclick="delProject(${pi})">Delete project</button></div></div>`).join('')+`<button class="b g" onclick="addProject()">+ Add a project</button>`;
}
function collectSteps(){
  const p=CUR.plan;
  document.querySelectorAll('[data-p]').forEach(card=>{
    const pr=p.projects[+card.dataset.p];
    pr.name=card.querySelector('.pn').value;pr.outcome=card.querySelector('.po').value;pr.done=card.querySelector('.pd').value;
    pr.keep=card.querySelector('.pk').value.split('\n').map(x=>x.trim()).filter(Boolean);
    card.querySelectorAll('[data-g]').forEach(gel=>{const g=pr.groups[+gel.dataset.g];g.name=gel.querySelector('.gn').value;g.sub=gel.querySelector('.gs').value});
  });
  document.querySelectorAll('.task').forEach(el=>{
    const t=tById(el.dataset.t);if(!t)return;
    t.title=el.querySelector('.tt').value;t.why=el.querySelector('.tw').value;t.mins=+el.querySelector('.tm').value||20;t.ai=el.querySelector('.ta').value==='1';
    t.note=el.querySelector('.tn').value;t.prompt=el.querySelector('.tp').value;t.d=el.querySelector('.td').value;t.who=el.querySelector('.tx').value.trim();t.type=el.querySelector('.ty').value;t.wait=el.querySelector('.tz').value.trim();
    ['d','who','type','wait'].forEach(k=>{if(!t[k])delete t[k]});
    t.steps=el.querySelector('.ts').value.split('\n').map(x=>x.trim()).filter(Boolean);
    if(!t.note)delete t.note;if(!t.prompt)delete t.prompt;
  });
}
const nid=()=>'t'+Date.now().toString(36)+Math.floor(Math.random()*99);
function addTask(pi,gi){collect();const t={id:nid(),title:'New step',why:'',mins:20,ai:false,steps:[]};CUR.plan.tasks.push(t);CUR.plan.projects[pi].groups[gi].ids.push(t.id);edit();document.querySelector(`.task[data-t="${t.id}"]`).classList.add('open')}
function addGroup(pi){collect();CUR.plan.projects[pi].groups.push({name:'New group',sub:'',ids:[]});edit()}
function addProject(){collect();CUR.plan.projects.push({id:'p'+Date.now().toString(36),name:'New project',outcome:'',done:'',groups:[{name:'Steps',sub:'',ids:[]}],keep:[]});edit()}
function mv(pi,gi,id,d){collect();const a=CUR.plan.projects[pi].groups[gi].ids;const i=a.indexOf(String(id));const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];edit()}
function delTask(pi,gi,id){if(!confirm('Delete this step?'))return;collect();const g=CUR.plan.projects[pi].groups[gi];g.ids=g.ids.filter(x=>String(x)!==String(id));CUR.plan.tasks=CUR.plan.tasks.filter(t=>String(t.id)!==String(id));edit()}
function delProject(pi){if(!confirm('Delete this whole project and its steps?'))return;collect();const pr=CUR.plan.projects[pi];const ids=pr.groups.flatMap(g=>g.ids.map(String));CUR.plan.tasks=CUR.plan.tasks.filter(t=>!ids.includes(String(t.id)));CUR.plan.projects.splice(pi,1);edit()}
/* ----- bank (words, stories and links the client reuses) ----- */
function bankHtml(){
  const b=CUR.plan.bank=CUR.plan.bank||[];
  return `<p class="muted">Shown on the client's Bank tab. Prompts from steps and each project's Keep handy list show up there on their own.</p>`+b.map((x,i)=>`<div class="card" data-b="${i}"><div class="row"><div class="fix" style="width:170px"><label>Group</label><input class="bc" value="${esc(x.c||'')}" placeholder="Captions, Brand voice, Stories, Links"/></div><div><label>Title</label><input class="bh" value="${esc(x.h||'')}"/></div></div><label>Text</label><textarea class="bb" style="min-height:90px">${esc(x.b||'')}</textarea><div class="row" style="margin-top:6px"><label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px"><input type="checkbox" class="bp" style="width:auto" ${x.pending?'checked':''}/> Not ready yet (shows "We are adding this")</label><button class="b r s fix" onclick="delBank(${i})">Delete</button></div></div>`).join('')+`<button class="b g s" onclick="addBank()">+ Add an item</button>`;
}
function collectBank(){
  const out=[];document.querySelectorAll('[data-b]').forEach(el=>{const o={c:el.querySelector('.bc').value.trim()||'Notes',h:el.querySelector('.bh').value.trim(),b:el.querySelector('.bb').value};if(el.querySelector('.bp').checked)o.pending=true;if(o.h||o.b)out.push(o)});
  CUR.plan.bank=out;
}
function addBank(){collectBank();CUR.plan.bank.push({c:'',h:'',b:''});edit()}
function delBank(i){collectBank();CUR.plan.bank.splice(i,1);edit()}
/* ----- progress ----- */
function progressHtml(){
  const pr=CUR.progress,done=new Set(pr.done.map(String));
  const rows=CUR.plan.projects.map(p=>`<h2>${esc(String(p.name).replace(/<[^>]+>/g,''))}</h2><div class="card">`+p.groups.flatMap(g=>g.ids).map(id=>{const t=tById(id);return t?`<div><label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px;color:#1a1a1a;font-weight:500;margin:3px 0"><input type="checkbox" style="width:auto" ${done.has(String(id))?'checked':''} onchange="tick('${esc(id)}',this.checked)"/>${esc(String(t.title).replace(/<[^>]+>/g,''))}</label>${(t.steps||[]).map((s,i)=>{const k=stKey(t,s);return `<label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:13px;color:#555;font-weight:400;margin:1px 0 1px 26px"><input type="checkbox" style="width:auto" ${(pr.steps||[]).includes(k)?'checked':''} onchange="tickStep('${esc(k)}',this.checked)"/>${esc(String(stText(s)).replace(/<[^>]+>/g,''))}</label>`}).join('')}</div>`:''}).join('')+'</div>').join('');
  const added=pr.added.length?`<h2>Steps they added</h2><div class="card">${pr.added.map(a=>`<div class="row"><label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px;color:#1a1a1a;font-weight:500"><input type="checkbox" style="width:auto" ${done.has(a.id)?'checked':''} onchange="tick('${esc(a.id)}',this.checked)"/>${esc(a.title)} <span class="muted">(${a.mins} min)</span></label><button class="b r s fix" onclick="rmAdded('${esc(a.id)}')">Remove</button></div>`).join('')}</div>`:'<p class="muted">They have not added any steps yet.</p>';
  return `<p class="muted">${pr.t?'Last activity: '+new Date(pr.t).toLocaleString():'No activity yet.'} Ticking here is the same as the client ticking it.</p>`+rows+added;
}
async function tickStep(k,on){const s=new Set(CUR.progress.steps||[]);on?s.add(k):s.delete(k);CUR.progress.steps=[...s];await api({action:'saveProgress',id:CUR.id,progress:CUR.progress});toast('Saved')}
async function tick(id,on){const s=new Set(CUR.progress.done.map(String));on?s.add(String(id)):s.delete(String(id));CUR.progress.done=[...s];await api({action:'saveProgress',id:CUR.id,progress:CUR.progress});toast('Saved')}
async function rmAdded(id){CUR.progress.added=CUR.progress.added.filter(a=>a.id!==id);CUR.progress.done=CUR.progress.done.filter(x=>x!==id);await api({action:'saveProgress',id:CUR.id,progress:CUR.progress});edit()}
KEY?home():login();
</script></body></html>
